name: Web (GitHub Pages)
# Exports the web build (Compatibility renderer, single-threaded so no special server headers are needed) and
# publishes it to GitHub Pages on every release tag, or on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot and export templates
        run: scripts/install-godot.sh 4.7.2
      - name: Import project
        run: tools/godot/godot --headless --import || true
      - name: Export web build
        run: |
          mkdir -p build/web
          tools/godot/godot --headless --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
